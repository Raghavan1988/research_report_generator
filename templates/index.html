<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Report Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.5;
            color: #1a1a1a;
        }
        h1 {
            font-size: 1.75rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 10px 16px;
            font-size: 1rem;
            color: #fff;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Research Report Generator</h1>
    <form id="report-form">
        <label for="topic">Enter the topic you want to research:</label>
        <input type="text" id="topic" name="topic">
        <button type="submit">Generate Report</button>
    </form>
    <h2>Generated Report</h2>
    <div id="report-link"></div>
    
    <script>
        document.getElementById('report-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const topic = document.getElementById('topic').value;
            
            fetch('/generate_report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ topic: topic }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('report-link').innerHTML = `<p style="color: red;">${data.error}</p>`;
                } else {
                    document.getElementById('report-link').innerHTML = `<a href="${data.report_url}" target="_blank">Open Generated Report</a>`;
                }
            });
        });
    </script>
</body>
</html>
