<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Report Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.5;
            color: #1a1a1a;
        }
        h1 {
            font-size: 1.75rem;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 10px 16px;
            font-size: 1rem;
            color: #fff;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        footer {
            margin-top: 40px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
            font-size: 0.85rem;
            color: #6b7280;
        }
        footer a {
            color: #2563eb;
        }
    </style>
</head>
<body>
    <h1>Research Report Generator</h1>
    <form id="report-form">
        <label for="topic">Enter the topic you want to research:</label>
        <input type="text" id="topic" name="topic" placeholder="e.g. The future of renewable energy" required>
        <button type="submit">Generate Report</button>
    </form>
    <h2>Generated Report</h2>
    <div id="report-link" role="status" aria-live="polite"></div>

    <footer>
        <a href="https://github.com/Raghavan1988/research_report_generator" target="_blank" rel="noopener">View this project on GitHub</a>
    </footer>

    <script>
        document.getElementById('report-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const topic = document.getElementById('topic').value;
            const button = this.querySelector('button');
            const output = document.getElementById('report-link');

            button.disabled = true;
            output.innerHTML = '<p>Generating report, this may take a moment…</p>';

            fetch('/generate_report', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ topic: topic }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    output.innerHTML = `<p style="color: red;">${data.error}</p>`;
                } else {
                    output.innerHTML = `<a href="${data.report_url}" target="_blank">Open Generated Report</a>`;
                }
            })
            .catch(() => {
                output.innerHTML = '<p style="color: red;">Something went wrong. Please try again.</p>';
            })
            .finally(() => {
                button.disabled = false;
            });
        });
    </script>
</body>
</html>
